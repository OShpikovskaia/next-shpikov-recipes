name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      # Enables Corepack for Yarn Berry (v2+) projects.
      # Harmless for Yarn v1 projects.
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies (Yarn v1 or v2+)
        shell: bash
        run: |
          set -e
          YARN_VERSION="$(yarn --version)"
          YARN_MAJOR="${YARN_VERSION%%.*}"
          echo "Detected Yarn version: $YARN_VERSION"

          if [ "$YARN_MAJOR" -eq 1 ]; then
            echo "Using Yarn classic install"
            yarn --frozen-lockfile
          else
            echo "Using Yarn Berry install"
            yarn install --immutable
          fi

      - name: Generate Prisma Client
        run: yarn prisma generate
        env:
          # Prisma often requires DATABASE_URL to be set even for generate.
          # This is a safe dummy value for CI.
          DATABASE_URL: 'postgresql://prisma:prisma@localhost:5432/prisma?schema=public'

      - name: Check Formatting
        run: yarn format:check

      - name: Lint and Type-check
        run: yarn check

      - name: Build Project
        run: yarn build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # If your build reads auth env vars at build-time, uncomment these:
          # AUTH_SECRET: "ci-secret"
          # NEXTAUTH_URL: "http://localhost:3000"
